name: test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * *'   # daily: the live catalog test also checks that the API is up
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
